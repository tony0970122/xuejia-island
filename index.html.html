function bird(g,x,y,z){const shape=new THREE.Mesh(new THREE.ConeGeometry(.11,.48,5),new THREE.MeshStandardMaterial({color:'#f5f0e2'}));shape.position.set(x,y,z);shape.rotation.z=Math.PI/2;g.add(shape);const wing=box(g,x,y+.04,z,.36,.035,.12,'#454d4b');wing.rotation.z=-.25}
for(const isl of islands){
 const g=new THREE.Group();g.position.copy(hexpos(isl.q,isl.r));positions[isl.id]=g.position.clone();
 // 每座島有海岸沙灘、草地平台與六角地形層次

 const base=new THREE.Mesh(new THREE.CylinderGeometry(radius-.12,radius-.12,.20,6),new THREE.MeshStandardMaterial({color:'#9dbb91',flatShading:true,roughness:1}));base.rotation.y=Math.PI/6;base.position.y=.42;base.receiveShadow=true;g.add(base);
 const rim=new THREE.Mesh(new THREE.CylinderGeometry(radius+.015,radius+.015,.10,6),new THREE.MeshStandardMaterial({color:'#f1e4c5',flatShading:true}));rim.rotation.y=Math.PI/6;rim.position.y=.34;g.add(rim);
 // island-specific recognizable landmarks
 if(isl.id==='culture'){
   temple(g,-.05,.0,1.0);tree(g,-1.55,-1.25,.85);tree(g,1.55,-1.15,.8);

 }else if(isl.id==='food'){
   pond(g,-.82,-.65,1.25,.85);pond(g,.65,-.65,1.15,.82);pond(g,-.05,.72,1.55,.82);fish(g,-.8,-.65);fish(g,.65,-.65);
   // farm produce rows
   for(let i=0;i<5;i++){const crop=box(g,-1.55+i*.22,.57,1.65,.10,.18,.24,i%2?'#5b9864':'#88a85d');}
 }else if(isl.id==='tourism'){
   // distinctive sunflower/mallow field
   for(let row=0;row<3;row++)for(let col=0;col<4;col++)flower(g,-1.15+col*.43,-1.35+row*.42,['#d85c91','#e4a04e','#c96b9d'][((row+col)%3)],.78);
   railway(g,-1.5,.75,1.25,.75);
   // little cycle path and bicycle wheels
   const path=new THREE.Mesh(new THREE.TorusGeometry(.58,.055,5,40),new THREE.MeshStandardMaterial({color:'#e6d7b8'}));path.rotation.x=Math.PI/2;path.position.set(.15,.54,.05);g.add(path);
   tree(g,1.65,-1.1,.8);
 }else if(isl.id==='regeneration'){
   farmhouse(g,-.25,-.1,1);tree(g,-1.55,1.0,.9);tree(g,1.45,1.05,.8);
   // courtyard table
   const table=box(g,.95,.67,-.1,.55,.08,.42,'#9c7657');const leg=box(g,.95,.48,-.1,.08,.32,.08,'#86684d');
 }else if(isl.id==='ecology'){
   // wetland pools, mangroves and migratory birds
   pond(g,-.75,-.45,1.65,1.05);pond(g,.8,.45,1.25,.85);
   for(let i=0;i<5;i++)tree(g,-1.55+i*.7,1.45-(i%2)*.22,.8);
   bird(g,-.5,1.5,-.9);bird(g,.35,1.7,-.65);bird(g,.9,1.45,-.9);
   for(let i=0;i<5;i++){const reed=box(g,-1.5+i*.55,.72,-1.75,.035,.5,.035,'#829b65');}
 }else if(isl.id==='industry'){
   // former textile factory / food processing workshop
   box(g,-.25,.88,-.05,1.35,.95,.95,'#d5b58b');const roof1=box(g,-.25,1.4,-.05,1.48,.12,1.08,'#9d6550');
   for(let i=0;i<3;i++){const chimney=new THREE.Mesh(new THREE.CylinderGeometry(.09,.12,.85,7),new THREE.MeshStandardMaterial({color:'#a86d58'}));chimney.position.set(-.72+i*.48,1.85,-.25);g.add(chimney)}
   for(let i=0;i<4;i++)box(g,.85,.58,-1.25+i*.35,.18,.24,.18,'#c3a66c');
 }else if(isl.id==='people'){
   // compact township street and houses
   for(let i=0;i<4;i++){const x=-1.15+(i%2)*1.35,z=-.85+Math.floor(i/2)*1.45;box(g,x,.72,z,.72,.62,.62,'#ead9bc');roof(g,x,1.18,z,.95,.9,i%2?'#a65d49':'#bd7655')}
   tree(g,1.55,1.25,.8);
 }else{
   // SWOT strategy island: civic plaza and connected community buildings
   farmhouse(g,-.55,-.1,.85);temple(g,.95,-.15,.65);tree(g,-1.5,1.1,.8);
 }
 // small coastal palms / rocks around each island
 for(let i=0;i<6;i++){const a=i*Math.PI/3+.2,x=Math.cos(a)*2.12,z=Math.sin(a)*2.12;const rock=new THREE.Mesh(new THREE.DodecahedronGeometry(.12,0),new THREE.MeshStandardMaterial({color:'#b5aa91',flatShading:true}));rock.position.set(x,.48,z);g.add(rock)}
 const hit=new THREE.Mesh(new THREE.CylinderGeometry(radius,radius,.9,6),new THREE.MeshBasicMaterial({visible:false}));hit.rotation.y=Math.PI/6;hit.position.y=.45;hit.userData=isl;g.add(hit);clickables.push(hit);
 g.add(makeLabel(isl.no+' '+isl.name));scene.add(g);

const lineGroup=new THREE.Group();scene.add(lineGroup);let lineObjects=[];function drawLinks(){lineGroup.clear();lineObjects=[];for(const [from,to,label,type] of links){const a=positions[from],b=positions[to];const curve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(a.x,.55,a.z),new THREE.Vector3((a.x+b.x)/2,2.3,(a.z+b.z)/2),new THREE.Vector3(b.x,.55,b.z));const pts=curve.getPoints(36);const geo=new THREE.BufferGeometry().setFromPoints(pts);const mat=new THREE.LineDashedMaterial({color:type==='idea'?'#b98661':type==='weak'?'#9c9ebd':'#6f9f9b',dashSize:.5,gapSize:.25,transparent:true,opacity:.85});const line=new THREE.Line(geo,mat);line.computeLineDistances();line.userData={from,to,label,type};lineGroup.add(line);lineObjects.push(line)}}drawLinks();lineGroup.visible=false;
function openInfo(isl){document.getElementById('title').textContent=isl.no+'｜'+isl.name;document.getElementById('summary').textContent=isl.summary;const d=document.getElementById('details');d.innerHTML='';isl.items.forEach(([name,desc])=>{const div=document.createElement('div');div.className='detail';const b=document.createElement('b');b.textContent=name;const p=document.createElement('p');p.textContent=desc;div.append(b,p);d.append(div)});document.getElementById('info').classList.add('open');controls.target.copy(positions[isl.id]);}
const ray=new THREE.Raycaster(),pointer=new THREE.Vector2();let down=null;renderer.domElement.addEventListener('pointerdown',e=>down=[e.clientX,e.clientY]);renderer.domElement.addEventListener('pointerup',e=>{if(!down||Math.hypot(e.clientX-down[0],e.clientY-down[1])>7)return;pointer.set(e.clientX/innerWidth*2-1,-e.clientY/innerHeight*2+1);ray.setFromCamera(pointer,camera);const hit=ray.intersectObjects(clickables)[0];if(hit)openInfo(hit.object.userData)});
const islandlist=document.getElementById('islandlist');islands.forEach(isl=>{const el=document.createElement('div');el.className='listitem';el.innerHTML=`<strong>${isl.no} ${isl.name}</strong><span>${isl.items.length} 個議題</span>`;el.onclick=()=>openInfo(isl);islandlist.append(el)});
const itemlist=document.getElementById('itemlist');function renderItems(query=''){itemlist.innerHTML='';const q=query.trim().toLowerCase();islands.forEach(isl=>isl.items.forEach(([name,desc])=>{if(q&&!(`${isl.name} ${name} ${desc}`.toLowerCase().includes(q)))return;const el=document.createElement('div');el.className='listitem';el.innerHTML=`<strong>${name}</strong><span>${isl.name}</span>`;el.onclick=()=>openInfo(isl);itemlist.append(el)}))}renderItems();document.getElementById('search').addEventListener('input',e=>renderItems(e.target.value));
document.getElementById('overview').onclick=()=>{controls.target.set(0,0,0);camera.position.set(16,25,34)};document.getElementById('linktoggle').onclick=e=>{lineGroup.visible=!lineGroup.visible;e.target.classList.toggle('active',lineGroup.visible);e.target.textContent=lineGroup.visible?'隱藏連線':'關係連線'};document.getElementById('help').onclick=()=>alert('操作方式：拖曳旋轉視角、滾輪縮放；點擊島嶼或左側分類查看內容；右側搜尋關鍵字；按「關係連線」查看創生議題間的關聯。');document.getElementById('close').onclick=()=>document.getElementById('info').classList.remove('open');
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);labels.setSize(innerWidth,innerHeight)});renderer.setAnimationLoop(()=>{controls.update();renderer.render(scene,camera);labels.render(scene,camera)});document.getElementById('loading').classList.add('hide');
